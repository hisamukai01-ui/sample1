<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>こんにちは</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: #f4f1e8;
      color: #203a32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 47px, rgb(32 58 50 / 4%) 48px),
        repeating-linear-gradient(90deg, transparent 0 47px, rgb(32 58 50 / 4%) 48px);
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 500;
      line-height: 1.2;
    }

    .accent {
      width: 3rem;
      height: 4px;
      margin: 1.5rem auto 0;
      background: #d66a45;
    }
  </style>
</head>
<body>
  <main>
    <h1>こんにちは</h1>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
